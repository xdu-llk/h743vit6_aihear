<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;letter-spacing:0}
      .title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#52616d}.h{font-size:21px;font-weight:700}
      .label{font-size:15px;font-weight:700}.small{font-size:13px;fill:#50606c}.tiny{font-size:11px;fill:#5a6872}
      .shell{fill:#f2f3f1;stroke:#283943;stroke-width:3}.body{fill:#313b42;stroke:#182228;stroke-width:3}
      .screen{fill:#101b22;stroke:#596b76;stroke-width:5}.glass{fill:#18303a}.vent{fill:url(#vent);stroke:#63747f;stroke-width:2}
      .call{fill:none;stroke:#556671;stroke-width:1.8}.dim{fill:none;stroke:#43525d;stroke-width:1.4;marker-start:url(#a);marker-end:url(#a)}
      .cool{fill:#e9f5f9;stroke:#3180a3;stroke-width:2}.hot{fill:#fff0eb;stroke:#c64235;stroke-width:2}.pcb{fill:#176b4b;stroke:#0d3f2d;stroke-width:2}
    </style>
    <pattern id="vent" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.7" fill="#596b75"/></pattern>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#43525d"/></marker>
  </defs>
  <rect width="1600" height="1080" fill="#f8fafb"/><rect width="1600" height="9" fill="#1a7b58"/>
  <text x="65" y="58" class="title">AI Hear 最终外壳工程方案</text>
  <text x="65" y="89" class="sub">桌面式3D打印/亚克力样机 · 建议外形150 × 115 × 65 mm · 前面板可拆</text>

  <!-- Front view -->
  <text x="80" y="140" class="h">正面</text>
  <rect x="90" y="165" width="600" height="460" rx="22" class="body"/>
  <rect x="105" y="180" width="570" height="430" rx="15" class="shell"/>
  <circle cx="132" cy="207" r="7" fill="#58656d"/><circle cx="648" cy="207" r="7" fill="#58656d"/>
  <circle cx="132" cy="583" r="7" fill="#58656d"/><circle cx="648" cy="583" r="7" fill="#58656d"/>
  <text x="130" y="232" class="label">AI HEAR</text><text x="130" y="251" class="tiny">STM32H743 EDGE MONITOR</text>

  <!-- OV2640 and dual flash -->
  <rect x="307" y="205" width="166" height="66" rx="18" fill="#263138"/>
  <circle cx="390" cy="238" r="25" fill="#0c1216" stroke="#71828c" stroke-width="5"/>
  <circle cx="390" cy="238" r="10" fill="#244b64"/><circle cx="332" cy="238" r="8" fill="#f1eee0"/>
  <circle cx="448" cy="238" r="8" fill="#f1eee0"/>

  <!-- TFT -->
  <rect x="315" y="300" width="150" height="150" rx="5" class="screen"/>
  <rect x="326" y="311" width="128" height="128" class="glass"/>
  <text x="354" y="338" font-size="18" font-weight="700" fill="#eef4f4">ARMED</text>
  <text x="336" y="364" font-size="9" fill="#8ea6af">SOUND</text><text x="408" y="364" font-size="12" fill="#fff">-42 dB</text>
  <rect x="336" y="376" width="108" height="7" rx="2" fill="#34464f"/><rect x="336" y="376" width="39" height="7" rx="2" fill="#399a73"/>
  <line x1="336" y1="397" x2="444" y2="397" stroke="#49606b"/>
  <text x="336" y="416" font-size="8" fill="#a8b7bd">26C</text><text x="374" y="416" font-size="8" fill="#a8b7bd">55%</text><text x="408" y="416" font-size="8" fill="#a8b7bd">PM102</text>
  <text x="336" y="432" font-size="8" fill="#65d29a">GAS100 · WIFI OK</text>

  <!-- mic, rgb, buzzer -->
  <circle cx="180" cy="505" r="5" fill="#172127"/><text x="145" y="534" class="tiny">INMP441拾音孔</text>
  <circle cx="390" cy="559" r="10" fill="#48c98b" stroke="#1f6f50" stroke-width="3"/><text x="354" y="587" class="tiny">RGB状态灯</text>
  <rect x="555" y="480" width="72" height="74" rx="8" class="vent"/><text x="550" y="575" class="tiny">蜂鸣器声孔</text>
  <rect x="145" y="300" width="56" height="118" rx="8" class="vent"/><text x="132" y="441" class="tiny">颗粒物进气</text>

  <!-- Front dimensions -->
  <path d="M90 650 H690" class="dim"/><text x="360" y="674" class="small">150 mm</text>
  <path d="M65 165 V625" class="dim"/><text x="41" y="415" class="small" transform="rotate(-90 41 415)">115 mm</text>

  <!-- Right side -->
  <text x="815" y="140" class="h">右侧</text>
  <rect x="825" y="165" width="310" height="460" rx="20" class="body"/>
  <rect x="843" y="183" width="274" height="424" rx="14" fill="#3d484f" stroke="#1b252b" stroke-width="2"/>
  <rect x="872" y="220" width="215" height="100" rx="8" class="vent"/>
  <text x="897" y="340" font-size="13" fill="#e6ecee">MQ-135独立排气 / 热区</text>
  <rect x="918" y="403" width="94" height="34" rx="6" fill="#10181d" stroke="#778891" stroke-width="2"/>
  <text x="924" y="460" font-size="13" fill="#e6ecee">H7 USB-C 5V</text>
  <circle cx="903" cy="520" r="19" fill="#1b252b" stroke="#8b9aa2" stroke-width="2"/>
  <circle cx="974" cy="520" r="19" fill="#1b252b" stroke="#8b9aa2" stroke-width="2"/>
  <text x="874" y="560" font-size="12" fill="#e6ecee">KEY1 RST</text><text x="952" y="560" font-size="12" fill="#e6ecee">KEY2 SETUP</text>
  <path d="M825 650 H1135" class="dim"/><text x="958" y="674" class="small">65 mm</text>

  <!-- callouts -->
  <path d="M473 224 L500 205" class="call"/><text x="505" y="203" class="label">OV2640 + 双补光</text><text x="505" y="222" class="small">抓拍时短暂开启</text>
  <path d="M465 370 L495 335" class="call"/><text x="500" y="330" class="label">1.54寸 ST7789</text><text x="500" y="349" class="small">约37.5mm包络</text>
  <path d="M180 505 L110 690 H80" class="call"/><text x="80" y="716" class="label">麦克风与蜂鸣器分离</text><text x="80" y="738" class="small">不同侧开孔，避免直接声学回灌</text>

  <!-- Internal section -->
  <text x="80" y="796" class="h">内部顶视分区</text>
  <rect x="90" y="820" width="1045" height="205" rx="12" class="shell"/>
  <rect x="115" y="842" width="238" height="160" rx="8" class="hot"/>
  <text x="136" y="875" class="label">热区</text><text x="136" y="901" class="small">MQ-135靠侧壁排气</text>
  <text x="136" y="925" class="small">FFC和塑料支柱避开</text>
  <rect x="377" y="842" width="500" height="160" rx="8" class="pcb"/>
  <rect x="455" y="870" width="330" height="95" rx="6" fill="#173444" stroke="#a7ced8" stroke-width="3"/>
  <text x="548" y="920" font-size="21" font-weight="700" fill="#fff">120 × 90 载板 + H7</text>
  <text x="528" y="949" font-size="13" fill="#cfe4e8">USB-C朝右 · FPC朝前</text>
  <rect x="900" y="842" width="205" height="160" rx="8" class="cool"/>
  <text x="922" y="875" class="label">冷区</text><text x="922" y="901" class="small">DHT11 + GP2Y进气</text>
  <text x="922" y="925" class="small">ESP天线朝右外壳</text><text x="922" y="949" class="small">INMP441靠前面板</text>
  <path d="M410 842 C410 800 510 800 510 842" stroke="#7256b3" stroke-width="8" fill="none"/>
  <path d="M455 842 C455 780 610 780 610 842" stroke="#7256b3" stroke-width="8" fill="none"/>
  <text x="478" y="812" class="tiny">CAMERA / DISPLAY FFC，保留自然弯曲半径</text>

  <rect x="1185" y="812" width="345" height="210" rx="8" fill="#fff" stroke="#c8d1d6"/>
  <text x="1206" y="845" class="h">结构实施要点</text>
  <text x="1206" y="880" class="small">• 前面板用4颗螺钉拆装，便于换FFC</text>
  <text x="1206" y="908" class="small">• PCB底部留8-10mm，最高模块实测后定深度</text>
  <text x="1206" y="936" class="small">• 进气与MQ排气不共用同一片密闭空间</text>
  <text x="1206" y="964" class="small">• USB-C、按键、BOOT0/RST均可从外部操作</text>
  <text x="1206" y="992" class="small">• 首版先打印低精度壳体验证，再做最终外观</text>
  <text x="80" y="1058" class="tiny">外形尺寸为可实现的首版建议，不替代实物卡尺测量。最终开孔需按到货ST7789/OV2640和已焊模块复核。</text>
</svg>
